<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
<h2>Prediction Result</h2>

<div class="result">

    <h1>Prediction Result</h1>

    <h2>{{ result }}</h2>

    <h3>status: {{status}}</h3>
<a href="/" class="btn-primary"><button>Back</button></a>
</div>
</body>
</html>
